    <style>
        :root {
            --bg-color: #f4f7fc;
            --container-bg: #ffffff;
            --text-color: #2c3e50;
            --table-border: #d0d7de;
            --table-header-bg: #2c3e50;
            --table-header-text: #ffffff;
            --table-row-odd: #fafbfc;
            --table-row-even: #f1f5f9;
            --highlight-bg: #e8f0fe;
            --highlight-text: #1a56a0;
            --notes-bg: #f8f9fa;
            --notes-border: #2c3e50;
            --shadow: 0 8px 25px rgba(0,0,0,0.1);
            --danger: #e74c3c;
            --success: #10b981;
        }
        body.dark {
            --bg-color: #1a1a2e;
            --container-bg: #16213e;
            --text-color: #e0e0e0;
            --table-border: #444;
            --table-header-bg: #0f3460;
            --table-header-text: #ffffff;
            --table-row-odd: #1f2a44;
            --table-row-even: #1a1f36;
            --highlight-bg: #2c3e6b;
            --highlight-text: #a8c6ff;
            --notes-bg: #1a1a2e;
            --notes-border: #0f3460;
            --shadow: 0 8px 25px rgba(0,0,0,0.5);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; transition: background-color 0.3s, color 0.3s, border-color 0.3s; }
        body {
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--container-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: var(--shadow);
        }
        h1 { text-align: center; margin-bottom: 5px; font-size: 28px; }
        .subtitle { text-align: center; opacity: 0.8; margin-bottom: 25px; font-size: 14px; }
        .auth-section { background: var(--notes-bg); border-radius: 12px; padding: 20px; margin-bottom: 25px; border: 1px solid var(--table-border); }
        .auth-form { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; align-items: center; }
        .controls { display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; margin-bottom: 25px; }
        .control-group { display: flex; align-items: center; gap: 8px; font-weight: 600; }
        select { background-color: var(--container-bg); color: var(--text-color); border: 1px solid var(--table-border); padding: 5px 10px; border-radius: 6px; font-size: 14px; }
        select option { background-color: var(--container-bg); color: var(--text-color); }
        .btn { display: inline-block; padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 14px; text-decoration: none; color: #fff; background: var(--table-header-bg); transition: background-color 0.2s; }
        .btn:hover { background: var(--primary-hover, #1a252f); }
        .btn-outline { background: transparent; border: 2px solid var(--table-header-bg); color: var(--table-header-bg); }
        .btn-outline:hover { background: var(--table-header-bg); color: #fff; }
        .btn-danger { background: var(--danger); }
        .btn-danger:hover { background: #c0392b; }
        .post-list { margin-top: 20px; }
        .post-item { border: 1px solid var(--table-border); border-radius: 12px; padding: 15px; margin-bottom: 15px; cursor: pointer; transition: transform 0.1s; }
        .post-item:hover { background: var(--notes-bg); }
        .post-title { font-size: 1.2rem; font-weight: bold; margin-bottom: 5px; }
        .post-meta { font-size: 12px; opacity: 0.7; margin-top: 5px; }
        .post-content { margin-top: 10px; white-space: pre-wrap; }
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
        .modal-overlay.show { display: flex; }
        .modal { background: var(--container-bg); color: var(--text-color); border-radius: 12px; max-width: 600px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 25px; box-shadow: 0 20px 40px rgba(0,0,0,0.3); }
        .modal h2 { margin-bottom: 15px; }
		.modal-content {
    background: var(--container-bg);
    color: var(--text-color);
    border-radius: 16px;
    max-width: 600px;
    width: 100%;
    box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    overflow: hidden;
    animation: modalFadeIn 0.3s ease;
}
@keyframes modalFadeIn {
    from { opacity: 0; transform: translateY(-30px); }
    to { opacity: 1; transform: translateY(0); }
}
.modal-header {
    background: var(--table-header-bg);
    color: var(--table-header-text);
    padding: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--table-border);
}
.modal-header h3 {
    margin: 0;
    font-size: 1.5rem;
}
.modal-close-btn {
    background: transparent;
    border: none;
    color: var(--table-header-text);
    font-size: 2rem;
    cursor: pointer;
    line-height: 1;
    padding: 0;
    opacity: 0.8;
}
.modal-body {
    padding: 25px;
    display: flex;
    flex-direction: column;
    gap: 15px;
    max-height: 70vh;
    overflow-y: auto;
}
.modal-footer {
    padding: 15px 25px;
    text-align: center;
    border-top: 1px solid var(--table-border);
    font-size: 0.9rem;
    opacity: 0.7;
}
#notifications-list li {
    padding: 10px 12px;
    background: var(--container-bg);
    border: 1px solid var(--table-border);
    border-radius: 8px;
    margin-bottom: 8px;
    cursor: pointer;
}
#notifications-list li.unread {
    background: var(--highlight-bg);
    font-weight: bold;
}
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 5px; }
        .form-group input, .form-group textarea { width: 100%; padding: 10px; border: 1px solid var(--table-border); border-radius: 6px; background: var(--notes-bg); color: var(--text-color); }
        .form-group textarea { min-height: 80px; }
        .comment-item { border-bottom: 1px solid var(--table-border); padding: 10px 0; display: flex; align-items: flex-start; gap: 10px; }
        .comment-author { font-weight: bold; font-size: 14px; }
        .comment-content { margin-top: 5px; white-space: pre-wrap; }
        .comment-time { font-size: 11px; opacity: 0.7; }
        .author-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; flex-shrink: 0; border: 1px solid var(--table-border); }
        .author-avatar-placeholder { display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 50%; background: var(--highlight-bg); color: var(--highlight-text); font-weight: bold; font-size: 18px; flex-shrink: 0; }
        .avatar { width: 40px; height: 40px; border-radius: 10px; background-color: var(--table-header-bg); color: var(--table-header-text); display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 20px; }
        .toast { position: fixed; bottom: 20px; right: 20px; background: #333; color: #fff; padding: 10px 20px; border-radius: 6px; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 2000; }
        .toast.show { opacity: 1; }
        .footer { max-width: 800px; margin: 20px auto; background: var(--container-bg); border-radius: 12px; box-shadow: var(--shadow); padding: 20px; display: flex; flex-wrap: wrap; gap: 20px; color: var(--text-color); }
        .footer-column { flex: 1; min-width: 150px; }
        .footer-column p { margin: 5px 0; line-height: 1.6; }
        .footer a { color: var(--text-color); text-decoration: none; }
        .footer a:hover { text-decoration: underline; }
        @media (max-width: 768px) {
            .container { padding: 15px; }
            .footer { padding: 15px; }
        }
		.forum-thumbnail {
    width: 80px;
    height: 80px;
    object-fit: cover;
    border-radius: 8px;
    cursor: pointer;
    border: 2px solid transparent;
    transition: border-color 0.2s, box-shadow 0.2s;
}
.forum-thumbnail.selected {
    border-color: var(--highlight-text);
    box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.5);
}

function renderAttachments(attachments) {
    if (!Array.isArray(attachments) || attachments.length === 0) return '';
    return `
        <div style="display:flex; flex-wrap:wrap; gap:10px; margin-top:10px;">
            ${attachments.map(att => {
                if (!att.url) return '';
                // If it's an image, show thumbnail; otherwise show link
                const isImage = /\.(jpg|jpeg|png|gif|webp|svg)$/i.test(att.url) || att.url.startsWith('data:image/');
                if (isImage) {
                    return `<a href="${att.url}" target="_blank"><img src="${att.url}" alt="${att.file_name || ''}" style="max-width:120px; max-height:120px; border-radius:8px; border:1px solid var(--table-border); object-fit:cover;"></a>`;
                } else {
                    return `<a href="${att.url}" target="_blank" style="font-size:14px;">📎 ${att.file_name || 'Attachment'}</a>`;
                }
            }).join('')}
        </div>
    `;
}

        async function loadPosts(reset = true) {
    if (reset) {
        postOffset = 0;
        hasMorePosts = true;
        document.getElementById('post-list').innerHTML = '';
    }

    if (!hasMorePosts) return;

    const from = postOffset;
    const to = postOffset + POSTS_PER_PAGE - 1;

    const { data: posts, error } = await supabaseClient
        .from('forum_posts')
        .select('id, title, content, author_id, created_at, is_pinned, attachments')
        .order('is_pinned', { ascending: false })
        .order('created_at', { ascending: false })
        .range(from, to);

    if (error) {
        console.warn('[Forum] Load posts error', error.message);
        return;
    }

    const list = document.getElementById('post-list');
    const t = translations[currentLanguage];

    if (!posts || posts.length === 0) {
        if (reset) list.innerHTML = `<p>${t.noPosts}</p>`;
        hasMorePosts = false;
        document.getElementById('load-more-posts-btn').style.display = 'none';
        return;
    }

    const postsHtml = posts.map(post => {
        const authorName = getDisplayName(post.author_id);
        const avatarHtml = getAvatarHtml(post.author_id);
        const attachmentCount = Array.isArray(post.attachments) ? post.attachments.length : 0;
        const attachmentBadge = attachmentCount > 0
            ? `<span style="margin-left:5px; font-size:12px; opacity:0.8;">📎 ${attachmentCount}</span>`
            : '';
        return `
        <div class="post-item" onclick="openPostDetail('${post.id}')">
            <div class="post-title">${post.title}${attachmentBadge}</div>
            <div class="post-meta">
                ${avatarHtml} <span style="margin-left:5px;">${authorName}</span> · ${new Date(post.created_at).toLocaleString()}
            </div>
            <div class="post-content">${post.content.substring(0, 200)}...</div>
        </div>`;
    }).join('');

    if (reset) {
        list.innerHTML = postsHtml;
    } else {
        list.insertAdjacentHTML('beforeend', postsHtml);
    }

    postOffset += posts.length;
    if (posts.length < POSTS_PER_PAGE) {
        hasMorePosts = false;
    }

    document.getElementById('load-more-posts-btn').style.display = hasMorePosts ? 'inline-block' : 'none';
}

function handleNewPostFolderSelection(event) {
    const files = Array.from(event.target.files || []);
    const container = document.getElementById('new-post-thumbnails');
    const filesInfo = document.getElementById('new-post-files-info');
    const t = translations[currentLanguage];

    container.innerHTML = '';
    filesInfo.textContent = '';
    selectedPostAttachments = [];

    if (files.length === 0) return;

    const imageFiles = files.filter(file => file.type.startsWith('image/'));
    if (imageFiles.length === 0) {
        filesInfo.textContent = t.noImages;
        return;
    }

    filesInfo.textContent = t.uploadingFiles;

    imageFiles.forEach(file => {
        // Upload immediately
        uploadForumFile(file)
            .then(async (url) => {
                // Append to backup table
                try {
                    await supabaseClient.rpc('append_forum_file_backup', {
                        p_user_id: currentUser.id,
                        p_file_name: file.name,
                        p_file_url: url
                    });
                } catch (backupErr) {
                    console.warn('[Forum Backup]', backupErr.message);
                }

                // Create thumbnail
                const img = document.createElement('img');
                img.src = url;
                img.className = 'forum-thumbnail';
                img.dataset.url = url;
                img.dataset.name = file.name;
                img.addEventListener('click', () => {
                    img.classList.toggle('selected');
                    const existingIndex = selectedPostAttachments.findIndex(a => a.url === url);
                    if (existingIndex >= 0) {
                        selectedPostAttachments.splice(existingIndex, 1);
                    } else {
                        selectedPostAttachments.push({ file_name: file.name, url });
                    }
                    filesInfo.textContent = t.filesSelected.replace('{count}', selectedPostAttachments.length);
                });
                container.appendChild(img);
            })
            .catch(err => {
                console.warn('[Forum Upload]', err.message);
                filesInfo.textContent = 'Upload failed for ' + file.name;
            });
    });
}

async function uploadForumFile(file) {
    const fileExt = file.name.split('.').pop();
    const fileName = `${Date.now()}-${Math.random().toString(36).substring(2)}.${fileExt}`;
    const filePath = `${currentUser.id}/${fileName}`;

    const { error } = await supabaseClient
        .storage
        .from('forum-uploads')
        .upload(filePath, file, {
            cacheControl: '3600',
            upsert: false
        });

    if (error) {
        console.warn('[Forum Upload]', error.message);
        throw error;
    }

    const { data } = supabaseClient
        .storage
        .from('forum-uploads')
        .getPublicUrl(filePath);

    return data.publicUrl;
}

        document.getElementById('post-detail-modal').addEventListener('click', function(e) { if (e.target === this) closePostDetailModal(); });
        document.getElementById('language-select').addEventListener('change', e => applyLanguage(e.target.value));
        document.getElementById('theme-toggle').addEventListener('click', () => {
            const newTheme = document.body.classList.contains('dark') ? 'light' : 'dark';
            applyTheme(newTheme);
            applyLanguage(currentLanguage);
        });
        document.getElementById('logout-btn').addEventListener('click', () => {
            localStorage.removeItem('edschedule_admin_logged');
            localStorage.removeItem('edschedule_student_id');
            window.location.href = 'index.html';
        });
        document.getElementById('student-card-btn').addEventListener('click', openStudentCardModal);
        document.getElementById('notifications-btn').addEventListener('click', openNotificationsModal);
        document.getElementById('notifications-modal').addEventListener('click', function(e) { if (e.target === this) closeNotificationsModal(); });
        document.getElementById('student-card-modal').addEventListener('click', function(e) { if (e.target === this) closeStudentCardModal(); });
document.getElementById('new-post-choose-folder').addEventListener('click', openNewPostFolderPicker);
document.getElementById('new-post-files').addEventListener('change', handleNewPostFolderSelection);
document.getElementById('comment-choose-folder').addEventListener('click', openCommentFolderPicker);
document.getElementById('comment-files').addEventListener('change', handleCommentFolderSelection);
document.getElementById('load-more-posts-btn').addEventListener('click', () => loadPosts(false));
        // Expose delete functions globally
        window.deleteComment = deleteComment;
        window.deletePost = deletePost;
    </script>
</body>
</html>
